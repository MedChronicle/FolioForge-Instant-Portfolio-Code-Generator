<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="ff-title ff-desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="ff-title">FolioForge</title>
  <desc id="ff-desc">A golden letter F with a glowing ember, the mark of the FolioForge portfolio studio.</desc>

  <style>
    :root {
      --tile-1: #1d2230;
      --tile-2: #090b10;
      --rim: #ffffff;
      --rim-opacity: 0.14;
      --gold-1: #fff3c4;
      --gold-2: #f7d37a;
      --gold-3: #d9983c;
      --bevel: #ffffff;
      --bevel-opacity: 0.55;
      --ember-1: #ffd2b3;
      --ember-2: #e8a081;
      --ember-3: #b9533c;
      --glow: #ff9a6b;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --tile-1: #fff9e8;
        --tile-2: #efe0bb;
        --rim: #5a3c0f;
        --rim-opacity: 0.22;
        --gold-1: #e0a33f;
        --gold-2: #b9741c;
        --gold-3: #7d4a0c;
        --bevel: #fff2cf;
        --bevel-opacity: 0.5;
        --ember-1: #ff9d78;
        --ember-2: #d9573a;
        --ember-3: #9c2f1c;
        --glow: #ff7a4d;
      }
    }
    .tile-1 { stop-color: var(--tile-1); }
    .tile-2 { stop-color: var(--tile-2); }
    .gold-1 { stop-color: var(--gold-1); }
    .gold-2 { stop-color: var(--gold-2); }
    .gold-3 { stop-color: var(--gold-3); }
    .ember-1 { stop-color: var(--ember-1); }
    .ember-2 { stop-color: var(--ember-2); }
    .ember-3 { stop-color: var(--ember-3); }
    .glow-stop { stop-color: var(--glow); }
    .rim { stroke: var(--rim); stroke-opacity: var(--rim-opacity); }
    .bevel { stroke: var(--bevel); stroke-opacity: var(--bevel-opacity); }
    .pulse { transform-origin: 48px 48px; animation: pulse 2.8s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50%      { opacity: 0.9;  transform: scale(1.18); }
    }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  </style>

  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" class="tile-1"/>
      <stop offset="1" class="tile-2"/>
    </linearGradient>

    <linearGradient id="gold" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" class="gold-1"/>
      <stop offset="0.5" class="gold-2"/>
      <stop offset="1" class="gold-3"/>
    </linearGradient>

    <radialGradient id="ember" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" class="ember-1"/>
      <stop offset="0.55" class="ember-2"/>
      <stop offset="1" class="ember-3"/>
    </radialGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" class="glow-stop" stop-opacity="0.75"/>
      <stop offset="1" class="glow-stop" stop-opacity="0"/>
    </radialGradient>

    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.1" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <clipPath id="tile-clip"><rect width="64" height="64" rx="18"/></clipPath>
  </defs>

  <!-- Tile -->
  <rect width="64" height="64" rx="18" fill="url(#tile)"/>

  <g clip-path="url(#tile-clip)">
    <!-- Soft top sheen -->
    <ellipse cx="22" cy="4" rx="34" ry="16" fill="#fff" opacity="0.06"/>
    <!-- Ember glow bleeding into the tile -->
    <circle class="pulse" cx="48" cy="48" r="16" fill="url(#glow)"/>
  </g>

  <!-- Inner rim for depth -->
  <rect class="rim" x="0.75" y="0.75" width="62.5" height="62.5" rx="17.25" fill="none" stroke-width="1.5"/>

  <!-- The F -->
  <g filter="url(#lift)">
    <path d="M17 18h29v8H26v7h17v8H26v9h-9V18Z" fill="url(#gold)"/>
    <!-- Bevel highlight along the lit top edges -->
    <path class="bevel" d="M17.8 18.8h27.4M17.8 18.8v31.4M26.8 33.8h15.4" fill="none" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Ember -->
  <circle cx="48" cy="48" r="6" fill="url(#ember)"/>
  <circle cx="46.2" cy="46.2" r="1.7" fill="#fff" opacity="0.55"/>

  <!-- Flying sparks -->
  <circle cx="55.5" cy="40.5" r="1.1" fill="var(--ember-1)" opacity="0.9"/>
  <circle cx="41" cy="55.8" r="0.8" fill="var(--ember-1)" opacity="0.7"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
