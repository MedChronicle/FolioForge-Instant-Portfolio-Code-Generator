<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Theme: follows the OS, switches the browser UI color to match -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#101217" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />

    <!-- Prevents a flash of the wrong theme: runs before first paint -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("folioforge-theme");
          var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
          document.documentElement.dataset.theme = saved || (prefersLight ? "light" : "dark");
        } catch (e) {}
      })();
    </script>

    <!-- SEO -->
    <title>FolioForge — Creative portfolio studio</title>
    <meta
      name="description"
      content="FolioForge is a creative portfolio studio for building and exporting memorable personal websites."
    />
    <meta name="application-name" content="FolioForge" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://your-domain.com/" />

    <!-- Open Graph / social previews (replace the domain and image) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FolioForge" />
    <meta property="og:title" content="FolioForge — Creative portfolio studio" />
    <meta
      property="og:description"
      content="Build and export memorable personal portfolio websites."
    />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta property="og:image" content="https://your-domain.com/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FolioForge — Creative portfolio studio" />
    <meta
      name="twitter:description"
      content="Build and export memorable personal portfolio websites."
    />
    <meta name="twitter:image" content="https://your-domain.com/og-image.png" />

    <!-- Icons and PWA -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Performance: connect early to font hosts if you use Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "FolioForge",
        "description": "A creative portfolio studio for building and exporting personal websites.",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <!-- Critical CSS: background + splash render instantly, before the bundle loads -->
    <style>
      :root { color-scheme: dark light; }
      html[data-theme="dark"]  { --bg: #101217; --fg: #e8eaf0; --accent: #8b9dff; }
      html[data-theme="light"] { --bg: #f6f7fb; --fg: #14161c; --accent: #4c5fe0; }
      html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); }
      body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .boot {
        min-height: 100dvh; display: grid; place-items: center; gap: 14px;
        align-content: center; text-align: center;
      }
      .boot-mark {
        width: 40px; height: 40px; border-radius: 50%;
        border: 3px solid color-mix(in srgb, var(--accent) 25%, transparent);
        border-top-color: var(--accent);
        animation: boot-spin 0.8s linear infinite;
      }
      .boot-text { font-size: 0.9rem; letter-spacing: 0.08em; opacity: 0.7; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-mark { animation-duration: 3s; } }
    </style>
  </head>

  <body>
    <!-- Splash is replaced automatically when React mounts into #root -->
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <div class="boot-mark" aria-hidden="true"></div>
        <div class="boot-text">Loading FolioForge…</div>
      </div>
    </div>

    <noscript>
      <p style="padding:2rem;font-family:system-ui;color:#e8eaf0">
        FolioForge needs JavaScript to run. Please enable it and reload.
      </p>
    </noscript>

    <!-- Vite replaces this with the hashed bundle and CSS link at build time -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
